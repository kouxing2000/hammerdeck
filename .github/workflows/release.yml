name: Release

# Tag-driven release: push a version tag (e.g. `v0.1.0`) and this builds the
# .app on a macOS runner via the SAME scripts/package.sh used locally, then
# attaches the zip to a GitHub Release for that tag. The tag IS the version
# (single source of truth) -- nothing here is hand-edited per release.
#
# Signing tier is chosen by package.sh from what it finds, not by a flag here:
# with the secrets below set, the run is Tier B (Developer ID + hardened runtime
# + notarized + stapled) and a stranger's download opens with no Gatekeeper wall.
# With them absent -- a fork, or before the secrets are configured -- it degrades
# to Tier A (ad-hoc) and still produces an artifact, rather than failing the job.
#
# Required secrets for Tier B:
#   MACOS_CERT_P12_BASE64    Developer ID Application cert + private key, exported
#                            from Keychain Access as .p12, then base64 encoded:
#                            `base64 -i cert.p12 | pbcopy`
#   MACOS_CERT_P12_PASSWORD  the password set during that export
#   ASC_KEY_ID               App Store Connect API key id
#   ASC_ISSUER_ID            App Store Connect issuer uuid
#   ASC_KEY_P8_BASE64        the AuthKey_<id>.p8, base64 encoded
#
# The .p8 and the .p12 are credentials and live ONLY in repo Secrets. The key id
# and issuer id are identifiers rather than secrets, but they are kept as secrets
# too so this file names nothing account-specific.
#
# Note: the download people are pointed at is the one on hammerdeck.peach-studio.com,
# NOT the GitHub Release asset. The Release is the durable record of what shipped
# and the source of the candidate a tester downloads; the site is the distribution
# channel, and it is what Sparkle's appcast points every installed copy at.
#
# This workflow does not touch the production site. `publish.yml` does, by hand,
# from this release's assets -- so a candidate can be built and tested before
# anyone is offered it.
#
# It has a SECOND trigger, and only one thing can come out of it: a STAGING build
# for the update/recovery rehearsal.
#
#   gh workflow run release.yml -f staging_version=9.9.8
#
# That path packages with HAMMERDECK_FEED=staging, creates no GitHub Release, and
# publishes straight to the staging feed. It lives here rather than in a workflow
# of its own because the eighty lines of certificate import above it are the
# expensive part, and a rehearsal must be built the way a release is or it
# rehearses nothing. It cannot reach production users: publish-site.sh derives
# its destination from the feed URL baked into the archive, so a staging build
# has nowhere else to go. The credentials are the other reason -- notarization
# and the Sparkle key live in repo secrets, so CI is where a rehearsal build can
# actually be produced.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      staging_version:
        description: 'Staging rehearsal version (e.g. 9.9.8). Publishes to the STAGING feed only.'
        required: true
        type: string

permissions:
  contents: write   # create the Release and upload assets

jobs:
  release:
    runs-on: macos-15
    env:
      # Surfaced here so steps can test for absence with `if:`. A secret cannot be
      # read directly in an `if:` expression; an env var carrying it can.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # What is being built and where it may go, answered once. A dispatch is a
      # staging rehearsal and a tag push is a release -- there is deliberately no
      # input that can make a dispatch produce a release build.
      FEED: ${{ github.event_name == 'workflow_dispatch' && 'staging' || 'release' }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_version || github.ref_name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      # `actions/checkout` does NOT bring the annotation. For a tag push its
      # ref-helper builds the refspec `+<github.sha>:refs/tags/<name>`, which
      # writes a COMMIT object into refs/tags/ -- a lightweight tag. Measured
      # against this repo: `git cat-file -t v0.1.2` then reports `commit`, and
      # `git tag -l --format='%(contents)'` answers with the tagged commit's
      # SUBJECT. Without this step the notes generator refuses (correctly) and
      # tells the maintainer to force-re-tag a tag that was annotated all along.
      #
      # A staging dispatch has no tag and needs no notes, so it skips this and
      # the gate below.
      - name: Fetch the annotated tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"

      # The release notes live in that annotation, and both channels below read
      # them from there. Checked FIRST, before a twenty-minute build and
      # notarization: a tag with no prose fails this job either way, and the
      # cheap failure should not arrive last. It also prints what will ship, so
      # the run log shows the notes before anything is published.
      #
      # Skipped without the signing secrets, which keeps this file's promise at
      # the top that a fork "degrades to Tier A and still produces an artifact,
      # rather than failing the job": a Tier A release publishes $UNSIGNED_NOTE
      # and never reads these notes, so refusing its tag would gate a fork's
      # build on prose nothing would have used.
      - name: Release notes gate
        if: github.event_name == 'push' && env.MACOS_CERT_P12_BASE64 != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "--- notes for $TAG ---"
          scripts/release-notes.py "$TAG"

      # Package.swift is swift-tools-version 6.0, so the toolchain must be Swift 6+.
      # Select the newest Xcode on the image and then ASSERT the Swift version,
      # rather than pinning a version series: pinning breaks silently the day the
      # image stops shipping that series, and the real requirement is the compiler
      # version, not the Xcode number.
      - name: Select Xcode and assert Swift 6+
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          swift --version
          # No pipe into an early-exiting filter. No step here sets `shell:`, so
          # GitHub runs the implicit `bash -e {0}` and pipefail is OFF -- but the
          # `if [ -n "$latest" ]` fallback above depends on that, and adding an
          # explicit `shell: bash` later would turn pipefail ON and make a missing
          # /Applications/Xcode_*.app abort the step before the guard can run.
          # Keeping the pipeline out of these two lines makes that irrelevant either way.
          ver="$(swift -version 2>&1)"
          major="$(printf '%s\n' "$ver" | sed -n 's/.*Swift version \([0-9][0-9]*\).*/\1/p' | tail -1)"
          if [ "${major:-0}" -lt 6 ]; then
            echo "error: Package.swift needs Swift 6+, toolchain reports major version '${major:-unknown}'" >&2
            exit 1
          fi
          echo "Swift major version $major -- ok"

      # Hand-rolled rather than `apple-actions/import-codesign-certs`, which does
      # the same job in ~5 lines. Two reasons it is worth the extra length here:
      # this repo is going PUBLIC, and a pinned third-party action is supply-chain
      # surface that a maintained alternative does not remove -- this step handles
      # secrets that can sign software as us. And the failure diagnosis below
      # (invalid-chain vs missing-private-key, each with its own fix) is better
      # than the generic action's, on a step whose failures are otherwise opaque.
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          # Ephemeral and thrown away with the runner, so a random password is
          # strictly better than a secret: nothing to leak and nothing to rotate.
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without this the keychain re-locks on the default 5-minute idle timer,
          # and a universal release build plus `swift test` runs far longer than
          # that -- codesign would then fail partway through a green-looking job.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's Developer ID intermediate is not on the runner, and Keychain
          # Access exports a .p12 carrying the LEAF ONLY. Without the intermediate
          # the identity imports fine and never validates -- the gate below then
          # reports a chain problem for a certificate that is perfectly good.
          # Fetching it here removes the dependency on how anyone exported. Both
          # generations, because which one signed a cert depends on when it was
          # issued: G1 (OU=Apple Certification Authority) through Feb 2027, G2
          # (OU=G2) after. Apple caps a leaf at its issuer's expiry, so a cert
          # issued today under G1 dies with it and re-issues onto G2.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsS -o "$RUNNER_TEMP/$ca.cer" \
              "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
          done

          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$CERT"

          # Required on macOS 10.12+. Without it codesign blocks on a keychain
          # access prompt that no one can answer on a runner, and reports
          # errSecInternalComponent instead of anything that names the cause.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # package.sh finds the identity via `security find-identity`, which only
          # searches the keychain SEARCH LIST -- creating the keychain does not add
          # it. Prepend ours while preserving the existing entries.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          # Gate: `security import` succeeds on a .p12 that carries no private key,
          # and on one whose chain will not validate -- both yield no usable
          # identity and would surface much later as an opaque codesign failure.
          # Assert a positive landmark instead of trusting the exit codes above.
          #
          # Read the VALID list and the FULL list separately so the error names the
          # actual cause: present-but-invalid is a trust/chain problem, absent
          # entirely is a missing private key. One message for both sends whoever
          # hits it down the wrong path. Captured into variables first -- piping
          # into `grep -q` would SIGPIPE the upstream command under pipefail.
          valid_ids="$(security find-identity -v -p codesigning)"
          all_ids="$(security find-identity -p codesigning)"
          case "$valid_ids" in
            *"Developer ID Application"*)
              echo "Developer ID Application identity is valid and visible to codesign" ;;
            *)
              case "$all_ids" in
                *"Developer ID Application"*)
                  echo "error: the Developer ID certificate imported but is NOT valid on this runner." >&2
                  echo "       Usually a chain problem: export the .p12 from Keychain Access with the" >&2
                  echo "       'Developer ID Certification Authority' intermediate included, or check expiry." >&2
                  exit 1 ;;
                *)
                  echo "error: no Developer ID Application identity after import." >&2
                  echo "       The .p12 almost certainly lacks the PRIVATE KEY -- in Keychain Access," >&2
                  echo "       export the identity (the key paired under the cert), not the cert alone." >&2
                  exit 1 ;;
              esac ;;
          esac

      - name: Write App Store Connect API key
        if: env.ASC_KEY_P8_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Fail here rather than at notarization: an empty or truncated secret
          # decodes without error and only surfaces as an opaque auth failure
          # after the build has already run.
          if ! openssl pkey -in "$KEY_PATH" -noout; then
            echo "error: ASC_KEY_P8_BASE64 did not decode to a usable private key" >&2
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package
        # package.sh runs `swift test` (the pre-package gate) before building, then
        # picks its tier: Developer ID identity present -> sign, notarize, staple.
        # ASC_* reach notarytool from the job env; ASC_KEY_PATH was set above.
        # HAMMERDECK_FEED decides which of package.sh's two feed constants gets
        # baked in, and therefore where the archive is allowed to be published.
        env:
          HAMMERDECK_FEED: ${{ env.FEED }}
        run: scripts/package.sh "$VERSION"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"

          # Which tier actually shipped -- asked of the ARTIFACT, not of whether a
          # secret was set. A stapled ticket is the exact property that decides
          # whether a stranger's download opens or hits a Gatekeeper wall, and it
          # is the one thing that cannot be true unless every signing step worked.
          # Tier A still publishes (a fork with no certificate must still get a
          # build) but it is marked, because a release that LOOKS like the signed
          # one and silently is not is worse than no release.
          UNSIGNED_NOTE="**Unsigned build.** Signing or notarization did not run, so macOS refuses to open this without a Gatekeeper override. Not for distribution -- check this run's signing steps."
          if xcrun stapler validate dist/Hammerdeck.app > /dev/null 2>&1; then
            TIER=B
            echo "tier B -- signed, notarized, stapled"
          else
            TIER=A
            echo "::warning::Tier A: this build is NOT notarized. Publishing as a marked prerelease."
          fi
          # The site step reads this to decide whether to touch the update feed.
          echo "TIER=$TIER" >> "$GITHUB_ENV"

          # The tag's annotation, through the same generator the appcast uses, so
          # the two channels cannot describe one release differently. It replaced
          # --generate-notes, which for a repo with no merged PRs produced a body
          # of exactly one line: the Full Changelog link.
          #
          # Not gh's own --notes-from-tag, which falls back to the tagged COMMIT's
          # message on a lightweight tag -- that publishes a commit subject as
          # release notes and looks entirely plausible. The generator refuses.
          #
          # Assigned here rather than inlined as `--notes "$(...)"` below: a
          # command substitution that fails inside an argument does NOT stop the
          # outer command under `bash -e`, so gh would publish empty notes. As its
          # own assignment it aborts the step, which is the whole point.
          if [ "$TIER" = B ]; then
            NOTES="$(scripts/release-notes.py "$TAG")"
          fi

          # Idempotent: `gh release create` hard-fails with "a release with the same
          # tag name already exists", so re-running a tag after fixing something
          # downstream threw away a completed build (and, now, a completed
          # notarization). Upload into the existing release instead.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists -- replacing its assets"
            gh release upload "$TAG" dist/Hammerdeck-*.zip --clobber
            # The marking has to be re-applied here too: a re-run that degrades to
            # Tier A would otherwise drop an unsigned build into a release still
            # presenting itself as the signed one.
            if [ "$TIER" = A ]; then
              gh release edit "$TAG" --prerelease --notes "$UNSIGNED_NOTE"
            else
              # The notes are re-applied on a re-run for the same reason the
              # marking is: the tag is the source, so a run after correcting an
              # annotation must carry the correction. It is also the only route
              # by which a release published without notes ever gets them.
              #
              # `--prerelease=false` because this branch is the REPAIR path: if
              # the first run degraded to Tier A it created the release marked
              # prerelease, and a re-run that now produces a notarized build must
              # clear that too -- otherwise the fixed release stays flagged and
              # excluded from Latest, half-repaired.
              gh release edit "$TAG" --notes "$NOTES" --prerelease=false
            fi
          elif [ "$TIER" = A ]; then
            gh release create "$TAG" dist/Hammerdeck-*.zip \
              --title "$TAG" --prerelease --notes "$UNSIGNED_NOTE"
          else
            gh release create "$TAG" dist/Hammerdeck-*.zip \
              --title "$TAG" --notes "$NOTES"
          fi

      # The staging rehearsal's whole output. No GitHub Release, no durable
      # record, no production surface: publish-site.sh reads the feed URL baked
      # into the archive and will deploy this to the staging site or refuse.
      # An unnotarized build is refused there too, which is deliberate -- a
      # rehearsal of an update macOS would block teaches the wrong lesson.
      - name: Publish to the staging feed
        if: github.event_name == 'workflow_dispatch'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install -g firebase-tools
          scripts/publish-site.sh "$VERSION"

      # On a tag push this job STOPS here, and that is the point. Publishing the
      # production site and appcast is `publish.yml`, run by hand against this
      # release's assets.
      #
      # It used to be the next step, which meant a notarized candidate could not
      # exist without every installed copy already having been offered it -- so
      # the checklist's order (download the candidate, test it on a clean
      # machine, rehearse the update, THEN publish) was unreachable. Splitting
      # them also means the bytes that get published are the bytes that were
      # tested: publish.yml downloads this release's asset rather than building
      # again, and a rebuild would produce a different digest and void the
      # evidence gathered against the first one.

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -rf "$RUNNER_TEMP/private_keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
