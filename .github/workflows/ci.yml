name: CI

# Per-commit test gate. release.yml only runs on `v*` tags, so until now nothing
# exercised the suite on a normal push. This runs the parts that pass reliably on a
# GitHub-hosted runner on every push/PR, plus -- on a MANUAL dispatch -- the gated
# UI tests (real NSPanels / Keychain / synthesized keystrokes).
#
# Why the UI tests are dispatch-only and best-effort: the 3 CGEvent/keystroke tests
# need Accessibility trust (AXIsProcessTrusted), which a hosted runner can't be
# granted -- they skip there no matter what. The 4 panel + 2 Keychain tests don't
# need AX, so the dispatch run exercises THOSE (so they stop bit-rotting), while
# `continue-on-error` keeps any hosted-runner WindowServer/Keychain quirk from
# turning into a red build. To run the keystroke tests too, run them locally with
# Accessibility granted: `HAMMERDECK_UI_TESTS=1 swift test` (see CLAUDE.md).

on:
  push:
    # EVERY branch (not tags -- release.yml's package.sh already gates v* tags):
    # feature/agent branches need the same per-commit verify as master, and a
    # remote (Linux) coding session cannot run the macOS half locally -- this
    # run IS its real verify. The concurrency group below collapses rapid
    # successive pushes per branch. Caveat, accepted: a branch that also has an
    # open PR runs twice (push + pull_request are different concurrency
    # groups) -- rare for a solo repo, and keeping pull_request is what gives
    # fork PRs their CI once the repo is public.
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel a superseded in-progress run when newer commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15   # Apple Silicon, same image release.yml builds on
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      # The content pre-commit hook is LOCAL (core.hooksPath) -- bypassable with
      # --no-verify, or simply never installed on a clone. This is its server-side
      # backstop: the same check over every tracked file, so business/strategy
      # content cannot ride a hookless commit into the public history unnoticed.
      - name: Business-content guard (hook backstop)
        run: scripts/hooks/pre-commit --all

      # README's feature catalog is GENERATED from each feature.json -- a doc that
      # restates what the code declares drifts by construction, so the code checks
      # the doc. Needs no toolchain, so it runs first: fastest possible red.
      - name: README feature catalog in sync
        run: scripts/gen-readme-features.py --check

      # The release-notes converter only RUNS during a release, so a regression
      # in it would otherwise surface mid-release, on the tag, with a build
      # already paid for. Its self-test needs no git, no tag and no toolchain.
      - name: Release-notes conversion
        run: scripts/release-notes.py --self-test

      # Same reasoning, and it carries more: the appcast generator owns the
      # promote gate and the carry-forward, so a regression here publishes a
      # feed that strands the install base rather than failing a build.
      - name: Appcast generation and the promote gate
        run: scripts/appcast.py --self-test

      # The download page's renderer, like the two above, only RUNS on a deploy.
      # Sample values, the same script publish-site.sh calls; the grep is the
      # check that does not trust the renderer's own leftover-token guard.
      - name: Download page renders
        run: |
          VERSION=0.0.0 DMG_URL=https://example.invalid/Hammerdeck-0.0.0.dmg \
          LENGTH=8405877 MIN_OS=13.0 PUB_DATE='Mon, 21 Sep 2026 12:00:00 +0000' \
            scripts/render-page.py site/index.html "$RUNNER_TEMP/index.html"
          if grep -n '{{' "$RUNNER_TEMP/index.html"; then
            echo "::error::unrendered {{ token(s) in the rendered download page"
            exit 1
          fi

      # Package.swift is swift-tools-version 6.0 -> Swift 6 (Xcode 16+). Pick the
      # newest Xcode 16 present so an image-default bump can't silently downgrade us
      # (mirrors release.yml).
      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: swift --version

      # The headless Lua suite on the EXACT embedded engine (compiles a 5.4.7
      # interpreter from Sources/CLua -- self-contained, no brew). Catches Lua-only
      # regressions swift test doesn't fully cover.
      - name: Lua suite (vendored 5.4.7)
        run: scripts/test-lua.sh

      # Static type gate: LuaLS over the whole workspace at Error level (the
      # type-mismatch family is escalated to Error in .luarc.json). This is
      # what makes the ---@enum/---@param annotations enforced rather than
      # editor-only -- e.g. passing "previous" where ScreenDir is expected
      # fails here. See scripts/check-lua-types.sh for the require-name stubs.
      - name: Lua type check (LuaLS)
        run: |
          brew install lua-language-server
          scripts/check-lua-types.sh

      # Real-bridge integration tests. The 8 gated UI tests auto-skip here
      # (HAMMERDECK_UI_TESTS unset), so this is the reliable per-commit gate.
      # Same link flags as the dev and release builds (scripts/lib/sdk-link-flags.sh
      # says why), so CI links the way a shipped binary does.
      - name: Swift integration tests
        run: |
          source scripts/lib/sdk-link-flags.sh
          swift test "${SWIFT_SDK_LINK_FLAGS[@]}"

      # Manual, best-effort: exercise the panel + Keychain UI tests on CI so they
      # stop rotting. CGEvent/keystroke tests still skip (no Accessibility trust).
      - name: Gated UI tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          source scripts/lib/sdk-link-flags.sh
          HAMMERDECK_UI_TESTS=1 swift test "${SWIFT_SDK_LINK_FLAGS[@]}"
