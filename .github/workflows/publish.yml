name: Publish

# Point hammerdeck.peach-studio.com and the update feed every installed copy
# polls at a release. The archive itself stays where `release.yml` put it, on
# this tag's GitHub Release -- the site carries the page and the appcast, and
# both link there. Run BY HAND, after the candidate has been tested:
#
#   gh workflow run publish.yml -f tag=v1.2.3                  to BETA
#   gh workflow run publish.yml -f tag=v1.2.3 -f stage=production   to everyone
#
# Beta is the default because the ladder only runs one way: a version reaches
# the default channel by being promoted after it has been on beta, and
# scripts/appcast.py refuses a promote whose bytes were never advertised there.
#
# It builds nothing. It downloads the archive `release.yml` already built,
# notarized and attached to that tag's GitHub Release, and publishes those exact
# bytes -- the ones a tester downloaded and ran. A rebuild here would produce a
# different digest (timestamps alone see to that) and quietly void every piece of
# evidence gathered against the first archive.
#
# The destination is not an input either. There is one site and one feed;
# scripts/publish-site.sh reads the `SUFeedURL` baked into the app inside the
# archive and refuses anything that does not poll it, which is how an archive
# built by something other than package.sh is kept off the feed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v1.2.3'
        required: true
        type: string
      stage:
        description: 'beta (default) offers it to subscribers; production promotes it to everyone'
        required: false
        default: beta
        type: choice
        options: [beta, production]

permissions:
  contents: read   # read the Release asset; the only write here is the tap push, on its own token

jobs:
  publish:
    # macos, not ubuntu: the gates in publish-site.sh are macOS trust services --
    # `xcrun stapler validate`, `codesign --verify`, `ditto`, and a `swift -e`
    # CryptoKit snippet that verifies the feed signature the way a client will.
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}

    steps:
      # NOT `ref: inputs.tag`. The tag decides which BYTES ship and what the
      # notes say; it must not decide which publisher runs. Checked out at the
      # tag, a fix to publish-site.sh or appcast.py would never reach a release
      # already cut -- so every past tag would keep publishing with the tooling
      # of its own day, and the move to GitHub-hosted archives would silently
      # not apply to v0.2.0.
      #
      # Nothing is weakened by this. Every gate downstream interrogates the
      # ARCHIVE -- its version, bundle id, public key, notarization ticket, and
      # `HDSourceCommit`, which is compared against what this tag resolves to.
      # That comparison needs the tag object, not a checkout of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # The release notes live in the tag's ANNOTATION and the generator refuses
      # a lightweight tag; the provenance gate needs the same object to resolve
      # a commit from. A default-branch checkout brings neither, so this fetch
      # is no longer conditional -- and `cat-file -t` proves what arrived rather
      # than assuming the fetch produced an annotated tag.
      - name: Fetch the tag object
        run: |
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          type="$(git cat-file -t "$TAG" 2>/dev/null || echo missing)"
          echo "tag object type: $type"
          if [ "$type" != tag ]; then
            echo "error: $TAG is a '$type', not an annotated tag." >&2
            echo "       Its message is where the release notes come from." >&2
            exit 1
          fi
          echo "$TAG -> $(git rev-list -n 1 "$TAG")"

      # `sign_update` lives inside the Sparkle SPM artifact bundle, so the
      # publish path needs it on disk. `resolve` is enough and takes seconds --
      # measured: it lands the binary at
      # .build/artifacts/sparkle/Sparkle/bin/sign_update with no compile.
      - name: Fetch the Sparkle artifact (for sign_update)
        run: swift package resolve

      # --clobber is not passed and must not be: this downloads, it never writes.
      - name: Download the built archive from the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern 'Hammerdeck-*.dmg' --dir dist
          ls -l dist
          shasum -a 256 dist/Hammerdeck-*.dmg

      - name: Publish site and update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Through env like TAG, not interpolated into the script body: the
          # `choice` type constrains it today, but every other input here goes
          # this way and one exception is how the pattern stops being a pattern.
          STAGE: ${{ inputs.stage }}
        run: |
          npm install -g firebase-tools
          if [ "$STAGE" = "production" ]; then
            scripts/publish-site.sh "${TAG#v}" --promote
          else
            scripts/publish-site.sh "${TAG#v}"
          fi


  # Homebrew follows PRODUCTION, so only a production publish moves it -- and
  # only after the page and feed, which is the order a user can observe: the
  # cask never offers a build the page does not. feed-watch.yml re-checks the
  # cask against the live feed daily.
  #
  # Its own job so "Re-run failed jobs" repeats ONLY this: rerunning the publish
  # job would re-promote, and appcast.py refuses a promote once the beta item is
  # gone. It re-downloads the archive rather than sharing it; 8 MB is cheaper
  # than an artifact hand-off.
  #
  # HOMEBREW_TAP_TOKEN is a fine-grained token with Contents: write on
  # kouxing2000/homebrew-tap ONLY. A missing token fails loudly rather than
  # skipping: the release is already out, and a silent skip is how the cask
  # drifts. The bump prints "unchanged" when the cask already matches.
  cask:
    needs: publish
    if: inputs.stage == 'production'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Point the Homebrew cask at this build
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the cask still offers the previous build"
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" --pattern 'Hammerdeck-*.dmg' --dir dist
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/kouxing2000/homebrew-tap.git" "$TAP_DIR"
          scripts/cask.py bump "${TAG#v}" dist/Hammerdeck-*.dmg "$TAP_DIR/Casks/hammerdeck.rb"
          if git -C "$TAP_DIR" diff --quiet; then
            exit 0
          fi
          git -C "$TAP_DIR" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "hammerdeck ${TAG#v}"
          git -C "$TAP_DIR" push origin HEAD:main
